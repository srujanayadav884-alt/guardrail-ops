server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router) — always fall back to index.html
    # so direct URL hits and page refreshes on e.g. /admin/policies work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets can be cached aggressively; index.html must not be,
    # so client always gets the latest bundle references after a deploy.
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
